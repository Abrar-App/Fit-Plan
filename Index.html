const app=$('#app');
const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const todayName=()=>dayNames[new Date().getDay()];
const todayISO=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DELOAD_WEEKS=[7,14,21,28];
let state={view:'home',week:+localStorage.getItem('fitplan-active-week')||1,activeWorkout:null};
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function workouts(){return loadJSON('fitplan-v4-workouts',[])}
function saveWorkout(w){const a=workouts();const i=a.findIndex(x=>x.id===w.id);if(i>=0)a[i]=w;else a.push(w);saveJSON('fitplan-v4-workouts',a)}
function rides(){return loadJSON('fitplan-v4-rides',[])}
function saveRides(v){saveJSON('fitplan-v4-rides',v)}
function weekObj(n=state.week){return PROGRAM_DATA.program.find(w=>w.week===n)}
function workoutFor(day=todayName(),n=state.week){return weekObj(n)?.days.find(d=>d.day===day)}
function isMarker(v){return typeof v==='number' && [-1,0,1,2].includes(v)}
function markerLevel(v,week){if(isMarker(v))return v;if(week<=10)return 0;return null}
function plannedLabel(v){if(v==null||v==='')return 'Not specified';if(isMarker(v))return `Load level ${v>0?'+':''}${v}`;return String(v)}
function parsePlannedWeight(raw){
 const s=String(raw??'').toLowerCase().trim();
 if(!s||s.includes('no weight')||isMarker(raw))return {weight:0,unit:'kg',ambiguous:!!s};
 const hasKg=s.includes('kg'), hasLb=s.includes('lb');
 if(hasKg&&hasLb)return {weight:0,unit:'kg',ambiguous:true};
 const unit=hasLb?'lb':'kg';
 const nums=[...s.matchAll(/\d+(?:\.\d+)?/g)].map(x=>+x[0]);
 if(!nums.length)return {weight:0,unit,ambiguous:true};
 // For dumbbell/plate notation such as 15+15kg, log the per-hand/per-side value initially.
 return {weight:nums[0],unit,ambiguous:false};
}
function convertWeight(v,from,to){if(from===to)return v;return from==='kg'?v*2.2046226218:v/2.2046226218}
function rounded(v,unit){return unit==='kg'?Math.round(v*2)/2:Math.round(v*2)/2}

function cardioActivityFor(day,week=state.week){

}

function warmupItemsForWorkout(w){
  const ex=w?.exercises||[], muscles=ex.map(e=>String(e.muscle||'').toLowerCase()), targets=ex.map(e=>String(e.targetMuscle||'').toLowerCase()), names=ex.map(e=>String(e.name||'').toLowerCase());
  const all=[...muscles,...targets,...names].join(' ');
  const items=[];
  const add=x=>{if(x&&!items.some(i=>i.name===x.name))items.push(x)};
  const upper=/chest|shoulder|tricep|bicep|back|lat|row|pulldown|fly|press/.test(all);
  const lower=/quad|glute|thigh|hamstring|calf|leg|squat|press \(foot|split squat/.test(all);
  if(upper) add(WARMUP_MOVES.generalUpper);
  if(/chest|press|shoulder/.test(all)){add(WARMUP_MOVES.bandPull);add(WARMUP_MOVES.extRotation);add(WARMUP_MOVES.scapPush)}
  if(/shoulder|overhead|lateral|rear delt/.test(all)) add(WARMUP_MOVES.wallSlide);
  if(/back|lat|row|pulldown/.test(all)){add(WARMUP_MOVES.straightArmBand);add(WARMUP_MOVES.thoracicRotation)}
  if(lower){add(WARMUP_MOVES.frontLegSwing);add(WARMUP_MOVES.ankleRock);add(WARMUP_MOVES.bodySquat)}
  if(/glute|split squat|squat|leg press/.test(all)) add(WARMUP_MOVES.gluteBridge);
  if(/quad|squat|lunge|split squat/.test(all)) add(WARMUP_MOVES.walkingLunge);
  if(/calf/.test(all)) add(WARMUP_MOVES.calfRaise);
  const first=ex[0];
  if(first && first.name){
    add({name:`Light Ramp-Up Set — ${first.name}`,dose:'1–2 light sets before working sets',text:`Perform the same movement as ${first.name}, but start with a clearly lighter load. Do about 8–12 smooth reps on the first warm-up set and, if needed, 5–8 reps with a moderately heavier warm-up load before starting the programmed working sets. Do not take warm-up sets near failure.`,why:'Practices the first programmed movement and prepares the exact joints and muscles you will load.'});
  }
  return items.slice(0,6);
}
function stretchItemsForWorkout(w){
  const all=(w?.exercises||[]).map(e=>`${e.muscle||''} ${e.targetMuscle||''}`).join(' ').toLowerCase();
  const items=[],add=x=>{if(x&&!items.some(i=>i.name===x.name))items.push(x)};
  if(/chest/.test(all))add(STRETCH_MOVES.chest);
  if(/shoulder|delt/.test(all))add(STRETCH_MOVES.shoulder);
  if(/tricep/.test(all))add(STRETCH_MOVES.triceps);
  if(/back|lat/.test(all))add(STRETCH_MOVES.back);
  if(/bicep/.test(all))add(STRETCH_MOVES.biceps);
  if(/quad|thigh/.test(all))add(STRETCH_MOVES.quads);
  if(/hamstring/.test(all))add(STRETCH_MOVES.hamstrings);
  if(/glute/.test(all))add(STRETCH_MOVES.glutes);
  if(/calf/.test(all))add(STRETCH_MOVES.calves);
  if(/leg|quad|glute|thigh/.test(all))add(STRETCH_MOVES.hipflexor);
  return items.slice(0,6);
}
function cardioRoutineItems(activity,type){
  const warm=type==='warmup';
  if(activity==='Running'){
    return warm?[
      {name:'Brisk Walk → Easy Jog',dose:'3–5 min',text:'Begin with a brisk walk, then transition into a very easy jog. Keep the effort conversational and use this only to raise body temperature—not to tire yourself.',why:'Gradually prepares the cardiovascular system and running muscles.'},
      WARMUP_MOVES.ankleRock,WARMUP_MOVES.frontLegSwing,WARMUP_MOVES.lateralLegSwing,WARMUP_MOVES.walkingLunge,WARMUP_MOVES.aMarch
    ]:[STRETCH_MOVES.calves,STRETCH_MOVES.hipflexor,STRETCH_MOVES.quads,STRETCH_MOVES.hamstrings,STRETCH_MOVES.glutes];
  }
  return warm?[
    {name:'Easy Pedal',dose:'3–5 min',text:'Start cycling at very light resistance and an easy cadence. Gradually increase cadence over several minutes while keeping resistance low and breathing comfortable.',why:'Warms the exact muscles and movement pattern used during cycling.'},
    WARMUP_MOVES.ankleRock,WARMUP_MOVES.frontLegSwing,WARMUP_MOVES.bodySquat,WARMUP_MOVES.gluteBridge
  ]:[STRETCH_MOVES.hipflexor,STRETCH_MOVES.quads,STRETCH_MOVES.hamstrings,STRETCH_MOVES.calves,STRETCH_MOVES.glutes];
}


const scheduleActions=()=>loadJSON('fitplan_schedule_actions',[]);

function dateLocalISO(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateFromISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function addDaysISO(s,n){const d=dateFromISO(s);d.setDate(d.getDate()+n);return dateLocalISO(d)}
function dayNameForDate(s){return dayNames[dateFromISO(s).getDay()]}
function completedOnDate(s){return workouts().some(w=>w.date===s&&w.completedAt)}
function actionForDate(s){return scheduleActions().find(a=>a.sourceDate===s)}
function recordScheduleAction(sourceDate,type,targetDate=null){
  const all=scheduleActions().filter(x=>x.sourceDate!==sourceDate);
  all.push({sourceDate,type,targetDate,week:state.week,createdAt:new Date().toISOString()});
  saveScheduleActions(all);
}
function effectiveWorkoutForDate(s,n=state.week){
  const ov=scheduleOverrides()[s];
  if(ov&&ov.week===n){
    const w=workoutFor(ov.sourceDay,n);
    if(w)return {...w,_scheduleOverride:ov};
  }
  return workoutFor(dayNameForDate(s),n);
}
function missedWorkoutsThisWeek(){
  const today=dateFromISO(todayISO()),dow=today.getDay(),daysSinceMon=(dow+6)%7;
  const monday=new Date(today);monday.setDate(today.getDate()-daysSinceMon);
  const out=[];
  for(let i=0;i<daysSinceMon;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);const ds=dateLocalISO(d);
    if(completedOnDate(ds)||actionForDate(ds))continue;
    const w=workoutFor(dayNameForDate(ds),state.week);
    if(w&&w.session!=='Rest'&&(w.exercises||[]).length)out.push({date:ds,w});
  }
  return out;
}

function cloneWorkoutForDate(w,date,meta={}){
  const log=createWorkout(w);
  const copied=JSON.parse(JSON.stringify(log));
  copied.id=`week${state.week}-${w.day}-${date}`;
  copied.date=date;
  copied.plannedDate=meta.rescheduledFrom||date;
  copied.rescheduledFrom=meta.rescheduledFrom||null;
  copied.manualBackdate=!!meta.manualBackdate;
  copied.startedAt=new Date().toISOString();
  copied.completedAt=null;
  const existing=workouts().find(x=>x.id===copied.id);
  return existing||copied;
}
function openWorkoutForDate(w,date,meta={}){
  const current=cloneWorkoutForDate(w,date,meta);
  openWorkoutRecord(w,current);
}

function latestExercise(name,excludeId){const a=workouts().filter(w=>w.completedAt&&w.id!==excludeId).sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt)));for(const w of a){const e=w.exercises?.find(x=>(x.substituteFor||x.planned?.name||x.name)===name);if(e)return e}return null}
function createWorkout(w){const id=`week${state.week}-${w.day}-${todayISO()}`;let log=workouts().find(x=>x.id===id);if(log)return log;log={id,date:todayISO(),week:state.week,day:w.day,session:w.session,startedAt:new Date().toISOString(),completedAt:null,exercises:w.exercises.map(ex=>{const prev=latestExercise(ex.name,id),p=parsePlannedWeight(ex.weightRaw),unit=prev?.sets?.[0]?.unit||p.unit,weight=prev?.sets?.[0]?.weight??p.weight;return {name:ex.name,substituteFor:null,muscle:ex.muscle,targetMuscle:ex.targetMuscle,planned:ex,actualTempo:prev?.actualTempo??ex.tempoSec??2,increment:unit==='kg'?2.5:5,sets:Array.from({length:+ex.sets||0},(_,i)=>({n:i+1,weight,unit,reps:typeof ex.reps==='number'?ex.reps:0,done:false}))}})};saveWorkout(log);return log}

function exerciseGuide(name,muscle,target){const n=String(name).toLowerCase();let steps,cues,mistakes;if(n.includes('press')){steps=['Set the seat or bench so the working position matches the intended muscle and your joints feel supported.','Plant your feet and keep the torso stable.','Lower the load under control through a comfortable range.','Press smoothly while keeping wrists and elbows aligned.','Return using the programmed tempo without bouncing.'];cues=['Stable torso','Controlled lowering','Do not shrug'];mistakes=['Using momentum','Excessive elbow flare','Forcing painful range']}else if(n.includes('pulldown')){steps=['Secure the thighs and take the required grip.','Sit tall and set the shoulders down.','Pull by driving the elbows toward your sides.','Pause when the target back muscles are shortened.','Return slowly to a controlled stretch.'];cues=['Elbows down','Chest tall','Control return'];mistakes=['Swinging backward','Pulling behind neck','Shrugging']}else if(n.includes('row')){steps=['Set the support so you can reach without rounding.','Begin with controlled shoulder-blade reach.','Drive the elbows back while keeping the torso stable.','Pause briefly at the shortened position.','Return under control.'];cues=['Lead with elbows','Neutral neck','No jerking'];mistakes=['Torso momentum','Shrugging','Rounding lower back']}else if(n.includes('curl')){steps=['Set the upper arm in a stable position.','Begin with the elbow extended comfortably.','Curl without allowing the elbow to drift excessively.','Squeeze briefly at the top.','Lower slowly to the start.'];cues=['Upper arm stable','No swinging','Full controlled range'];mistakes=['Swinging torso','Rushing eccentric','Wrist bending']}else if(n.includes('lateral raise')){steps=['Keep a slight bend in the elbow.','Start the arm slightly in front of the body.','Raise the arm out and slightly forward.','Stop near shoulder height or your comfortable range.','Lower slowly.'];cues=['Lead with elbow','Shoulder down','Light controlled load'];mistakes=['Shrugging','Swinging','Going too heavy']}else{steps=['Set up the equipment so your body is stable.','Begin from a controlled starting position.','Move through a comfortable range using the programmed tempo.','Keep non-working body parts still and avoid momentum.','Return to the start under control.'];cues=['Controlled tempo','Stable position',`Focus on ${target||muscle}`];mistakes=['Using momentum','Changing the movement to lift more weight','Continuing through sharp joint pain']}return {steps,cues,mistakes}}

  $('#cwarm',o).onclick=()=>openCardioRoutine(activity,'warmup');
  $('#cstretch',o).onclick=()=>openCardioRoutine(activity,'stretch');
  $('#saveRide',o).onclick=()=>{const x={...old,id,date:todayISO(),day:todayName(),activity,minutes:+$('#rmin',o).value||0,km:+$('#rkm',o).value||0,calories:+$('#rcal',o).value||0,completedAt:new Date().toISOString()};x.avgSpeedKmh=x.minutes>0?x.km/(x.minutes/60):0;x.avgPaceMinKm=x.km>0?x.minutes/x.km:0;const i=rs.findIndex(r=>r.id===old.id||r.id===id);if(i>=0)rs[i]=x;else rs.push(x);saveRides(rs);closeOverlay();render()};
}

function openRide(){openCardio('Cycling')}
render();
</script></body></html>
